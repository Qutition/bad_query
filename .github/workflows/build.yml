name: Build Xcode Project

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install & Select Xcode 27 Beta
        uses: xcodesorg/setup-xcode@v1
        with:
          xcode-version: '27.0-beta.6'
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Build Project
        run: |
          xcodebuild build \
            -project bad_query.xcodeproj \
            -target bad_query \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=
